name: Validate

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: |
          npm run test:handicap
          npm run test:caddie
          npm run test:gamification
          npm run test:stats
          npm run test:home
          npm run test:club-setup
          npm run test:profile
          npm run test:units
          npm run test:shots
          npm run test:course-validation
